<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-P4 Neural Monitor</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap");
  :root {
    --bg-primary: #0a0c12; --card-bg: rgba(16,22,40,0.75);
    --card-border: rgba(0,200,255,0.15);
    --neon-cyan: #00e5ff; --neon-purple: #d500f9;
    --neon-green: #00e676; --neon-red: #ff1744;
    --text-primary: #e8eaf6;
    --text-secondary: rgba(200,210,240,0.6);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Inter",-apple-system,sans-serif;
    background:var(--bg-primary);color:var(--text-primary);
    min-height:100vh;overflow-x:hidden;position:relative
  }
  .ambient-orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .ambient-orbs .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0;animation:orbF 20s ease-in-out infinite}
  .ambient-orbs .orb:nth-child(1){width:600px;height:600px;background:radial-gradient(circle,rgba(0,229,255,0.12),transparent 70%);top:-15%;left:-10%;animation-delay:0s}
  .ambient-orbs .orb:nth-child(2){width:500px;height:500px;background:radial-gradient(circle,rgba(213,0,249,0.08),transparent 70%);bottom:-20%;right:-8%;animation-delay:-7s}
  .ambient-orbs .orb:nth-child(3){width:400px;height:400px;background:radial-gradient(circle,rgba(0,230,118,0.07),transparent 70%);top:50%;left:50%;animation-delay:-14s}
  @keyframes orbF{0%,100%{opacity:0.3;transform:translate(0,0) scale(1)}25%{opacity:0.6;transform:translate(40px,-30px) scale(1.1)}50%{opacity:0.2;transform:translate(-20px,40px) scale(0.9)}75%{opacity:0.5;transform:translate(30px,20px) scale(1.05)}}
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .grid-bg .gh{position:absolute;inset:0;background-image:linear-gradient(rgba(0,200,255,0.025) 1px,transparent 1px);background-size:100% 60px;animation:gsv 30s linear infinite}
  .grid-bg .gv{position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(0,200,255,0.025) 1px,transparent 1px);background-size:60px 100%;animation:gsh 40s linear infinite}
  .grid-bg .gbh{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,255,0.08),transparent);animation:blv 8s linear infinite;top:-1px}
  .grid-bg .gbv{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(0,229,255,0.08),transparent);animation:blh 12s linear infinite;left:-1px}
  .grid-bg .rg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(0,200,255,0.08),transparent 70%);animation:gp 8s ease-in-out infinite alternate}
  @keyframes gp{0%{opacity:0.6}100%{opacity:1}}
  @keyframes gsv{0%{transform:translateY(0)}100%{transform:translateY(60px)}}
  @keyframes gsh{0%{transform:translateX(0)}100%{transform:translateX(60px)}}
  @keyframes blv{0%{transform:translateY(-100vh)}100%{transform:translateY(100vh)}}
  @keyframes blh{0%{transform:translateX(-100vw)}100%{transform:translateX(100vw)}}
  .scanlines{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,200,255,0.015) 2px,rgba(0,200,255,0.015) 4px)
  }
  .particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .particle{
    position:absolute;width:3px;height:3px;background:var(--neon-cyan);
    border-radius:50%;box-shadow:0 0 6px var(--neon-cyan),0 0 12px rgba(0,229,255,0.3);
    opacity:0;animation:pf 12s infinite ease-in-out
  }
  .particle:nth-child(1){left:10%;top:20%;animation-delay:0s;width:2px;height:2px}
  .particle:nth-child(2){left:25%;top:60%;animation-delay:2s;width:4px;height:4px;background:var(--neon-purple);box-shadow:0 0 8px var(--neon-purple)}
  .particle:nth-child(3){left:45%;top:10%;animation-delay:4s;width:2px;height:2px}
  .particle:nth-child(4){left:65%;top:70%;animation-delay:1s;width:3px;height:3px;background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}
  .particle:nth-child(5){left:80%;top:30%;animation-delay:3s;width:2px;height:2px}
  .particle:nth-child(6){left:50%;top:85%;animation-delay:5s;width:4px;height:4px;background:var(--neon-purple);box-shadow:0 0 8px var(--neon-purple)}
  .particle:nth-child(7){left:15%;top:45%;animation-delay:6s;width:2px;height:2px}
  .particle:nth-child(8){left:90%;top:55%;animation-delay:2.5s;width:3px;height:3px}
  @keyframes pf{
    0%,100%{opacity:0;transform:translateY(0) scale(0.5)}
    10%{opacity:1}30%{opacity:0.8;transform:translateY(-30px) scale(1)}
    60%{opacity:0.3;transform:translateY(-60px) scale(0.6)}
    100%{opacity:0;transform:translateY(-100px) scale(0.2)}
  }
  .container{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px 24px 60px}
  .header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:32px;padding-bottom:20px;
    border-bottom:1px solid rgba(0,200,255,0.1);position:relative
  }
  .header::after{
    content:"";position:absolute;bottom:-1px;left:0;
    width:120px;height:1px;
    background:linear-gradient(90deg,var(--neon-cyan),transparent)
  }
  .brand{display:flex;align-items:center;gap:16px}
  .brand-icon{
    width:42px;height:42px;border:1.5px solid var(--neon-cyan);
    border-radius:10px;display:flex;align-items:center;
    justify-content:center;position:relative;
    background:rgba(0,229,255,0.05);
    box-shadow:0 0 20px rgba(0,229,255,0.1),inset 0 0 20px rgba(0,229,255,0.03)
  }
  .brand-icon svg{width:22px;height:22px}
  .brand-icon::after{
    content:"";position:absolute;inset:-2px;border-radius:12px;
    background:linear-gradient(135deg,var(--neon-cyan),transparent 50%);
    z-index:-1;opacity:0.3
  }
  .brand-text h1{
    font-family:"Orbitron",monospace;font-size:18px;
    font-weight:700;letter-spacing:2px;
    background:linear-gradient(135deg,#e8eaf6,var(--neon-cyan));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
  }
  .brand-text .sub{font-size:11px;color:var(--text-secondary);letter-spacing:3px;text-transform:uppercase;margin-top:2px}
  .status-badge{
    display:flex;align-items:center;gap:10px;padding:8px 18px 8px 14px;
    border-radius:30px;font-size:12px;font-weight:500;letter-spacing:0.5px;
    border:1px solid;transition:all 0.4s ease;position:relative
  }
  .status-badge.online{
    border-color:rgba(0,230,118,0.3);background:rgba(0,230,118,0.06);
    color:var(--neon-green);box-shadow:0 0 20px rgba(0,230,118,0.08)
  }
  .status-badge.offline{
    border-color:rgba(255,23,68,0.3);background:rgba(255,23,68,0.06);
    color:var(--neon-red);box-shadow:0 0 20px rgba(255,23,68,0.08)
  }
  .status-badge .dot{
    width:8px;height:8px;border-radius:50%;background:currentColor;position:relative
  }
  .status-badge.online .dot{
    animation:dp 1.5s ease-in-out infinite;box-shadow:0 0 8px var(--neon-green)
  }
  .status-badge.offline .dot{
    animation:dp 2s ease-in-out infinite;box-shadow:0 0 8px var(--neon-red)
  }
  @keyframes dp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)}}
  .status-badge .ring{
    position:absolute;width:24px;height:24px;border-radius:50%;border:1px solid currentColor;
    left:10px;top:50%;transform:translateY(-50%);
    animation:rp 2s ease-out infinite;opacity:0;pointer-events:none
  }
  .status-badge.online .ring{border-color:var(--neon-green)}
  .status-badge.offline .ring{border-color:var(--neon-red)}
  @keyframes rp{0%{transform:translateY(-50%) scale(0.5);opacity:0.6}100%{transform:translateY(-50%) scale(2.5);opacity:0}}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
  .stat-card{
    background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;
    padding:20px 22px;backdrop-filter:blur(12px);
    position:relative;overflow:hidden;transition:all 0.3s ease
  }
  .stat-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;opacity:0.6;transition:opacity 0.3s ease
  }
  .stat-card:nth-child(1)::before{background:linear-gradient(90deg,var(--neon-cyan),transparent)}
  .stat-card:nth-child(2)::before{background:linear-gradient(90deg,var(--neon-purple),transparent)}
  .stat-card:nth-child(3)::before{background:linear-gradient(90deg,var(--neon-green),transparent)}
  .stat-card:hover{
    border-color:rgba(0,200,255,0.3);transform:translateY(-2px);
    box-shadow:0 8px 32px rgba(0,200,255,0.08)
  }
  .stat-card:hover::before{opacity:1}
  .stat-card .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .stat-card .label{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:2px;font-weight:500}
  .stat-card .icon-dot{width:8px;height:8px;border-radius:50%;opacity:0.8}
  .stat-card:nth-child(1) .icon-dot{background:var(--neon-cyan);box-shadow:0 0 8px var(--neon-cyan)}
  .stat-card:nth-child(2) .icon-dot{background:var(--neon-purple);box-shadow:0 0 8px var(--neon-purple)}
  .stat-card:nth-child(3) .icon-dot{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}
  .stat-card .value{
    font-family:"Orbitron",monospace;font-size:32px;
    font-weight:700;letter-spacing:1px;line-height:1
  }
  .stat-card:nth-child(1) .value{color:var(--neon-cyan);text-shadow:0 0 20px rgba(0,229,255,0.3)}
  .stat-card:nth-child(2) .value{color:var(--neon-purple);text-shadow:0 0 20px rgba(213,0,249,0.3)}
  .stat-card:nth-child(3) .value{color:var(--neon-green);text-shadow:0 0 20px rgba(0,230,118,0.3)}
  .stat-card .value-bar{margin-top:8px;height:2px;border-radius:2px;background:rgba(255,255,255,0.04);overflow:hidden}
  .stat-card .value-bar .fill{height:100%;border-radius:2px;transition:width 0.6s ease;width:0%}
  .stat-card:nth-child(1) .value-bar .fill{background:linear-gradient(90deg,var(--neon-cyan),transparent)}
  .stat-card:nth-child(2) .value-bar .fill{background:linear-gradient(90deg,var(--neon-purple),transparent)}
  .stat-card:nth-child(3) .value-bar .fill{background:linear-gradient(90deg,var(--neon-green),transparent)}
  .control-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:0 4px}
  .control-bar .title-section{display:flex;align-items:center;gap:12px}
  .control-bar .title-section h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--text-secondary)}
  .control-bar .title-section .live-badge{
    display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;
    letter-spacing:1px;text-transform:uppercase;color:var(--neon-green);
    padding:3px 10px;border-radius:20px;background:rgba(0,230,118,0.08);
    border:1px solid rgba(0,230,118,0.15)
  }
  .control-bar .title-section .live-badge .blip{
    width:5px;height:5px;border-radius:50%;background:var(--neon-green);
    animation:bl 1s step-end infinite;box-shadow:0 0 6px var(--neon-green)
  }
  @keyframes bl{0%,100%{opacity:1}50%{opacity:0.2}}
  .control-bar .countdown{font-family:"Orbitron",monospace;font-size:12px;color:var(--text-secondary);letter-spacing:1px}
  .control-bar .countdown span{color:var(--neon-cyan);text-shadow:0 0 10px rgba(0,229,255,0.3);font-weight:700}
  .table-wrap{
    background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;
    overflow:hidden;backdrop-filter:blur(12px);box-shadow:0 4px 30px rgba(0,0,0,0.3)
  }
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{
    text-align:left;padding:14px 20px;font-weight:500;font-size:10px;
    text-transform:uppercase;letter-spacing:1.5px;color:var(--text-secondary);
    border-bottom:1px solid rgba(0,200,255,0.08);background:rgba(0,200,255,0.02)
  }
  tbody tr{
    transition:all 0.2s ease;border-bottom:1px solid rgba(0,200,255,0.04);
    animation:ri 0.35s ease backwards
  }
  @keyframes ri{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:rgba(0,200,255,0.04)}
  tbody td{padding:13px 20px;vertical-align:middle}
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 12px 4px 10px;border-radius:6px;
    font-size:11px;font-weight:600;letter-spacing:0.3px;border:1px solid transparent
  }
  .tag::before{content:"";width:5px;height:5px;border-radius:50%}
  .tag.face_recognized,.tag.face_recognize{
    background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.2);color:#00e5ff
  }
  .tag.face_recognized::before,.tag.face_recognize::before{background:#00e5ff;box-shadow:0 0 6px #00e5ff}
  .tag.voice_command{
    background:rgba(213,0,249,0.08);border-color:rgba(213,0,249,0.2);color:#d500f9
  }
  .tag.voice_command::before{background:#d500f9;box-shadow:0 0 6px #d500f9}
  .tag.heartbeat{
    background:rgba(0,230,118,0.08);border-color:rgba(0,230,118,0.2);color:#00e676
  }
  .tag.heartbeat::before{background:#00e676;box-shadow:0 0 6px #00e676}
  .detail-cell{max-width:400px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--text-secondary);font-size:12px}
  .time-cell{white-space:nowrap;font-size:12px;color:var(--text-secondary);font-family:"JetBrains Mono","SF Mono",monospace;font-variant-numeric:tabular-nums}
  .empty-state{text-align:center;padding:60px 20px}
  .empty-state .empty-icon{font-size:32px;margin-bottom:12px;opacity:0.3}
  .empty-state .empty-text{color:var(--text-secondary);font-size:13px;letter-spacing:0.5px}
  .modal-overlay{
    display:none;position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
    align-items:center;justify-content:center
  }
  .modal-overlay.active{display:flex}
  .modal{
    background:rgba(16,22,40,0.95);border:1px solid rgba(0,200,255,0.15);
    border-radius:16px;padding:28px 32px;max-width:500px;width:90vw;
    box-shadow:0 0 60px rgba(0,200,255,0.08),0 20px 60px rgba(0,0,0,0.5);
    animation:mi 0.25s ease;position:relative
  }
  @keyframes mi{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .modal-close{
    position:absolute;top:14px;right:18px;background:none;border:none;
    color:var(--text-secondary);font-size:20px;cursor:pointer;
    padding:4px 8px;border-radius:6px;transition:all 0.2s
  }
  .modal-close:hover{color:var(--text-primary);background:rgba(255,255,255,0.05)}
  .modal h3{font-size:14px;font-weight:600;margin-bottom:16px;color:var(--neon-cyan);letter-spacing:0.5px}
  .modal .detail-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
  .modal .detail-grid .k{color:var(--text-secondary);font-weight:500}
  .modal .detail-grid .v{color:var(--text-primary);word-break:break-all}
  @media(max-width:700px){
    .container{padding:16px 14px 40px}
    .header{flex-direction:column;align-items:flex-start;gap:14px}
    .stats{grid-template-columns:1fr;gap:10px}
    .stat-card .value{font-size:26px}
    thead th,tbody td{padding:10px 12px;font-size:12px}
    .detail-cell{max-width:160px}
    .brand-text h1{font-size:15px}
    .modal{padding:20px}
  }
  @keyframes sh{0%{background-position:-200px 0}100%{background-position:200px 0}}
  tr.just-added td:first-child::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(0,229,255,0.06),transparent);
    background-size:200px 100%;animation:sh 1s ease forwards;pointer-events:none
  }
</style>
</head>
<body>
<div class="ambient-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div class="grid-bg"><div class="gh"></div><div class="gv"></div><div class="gbh"></div><div class="gbv"></div><div class="rg"></div></div>
<div class="scanlines"></div>
<div class="particles">
  <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
</div>
<div class="container">
  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:#00e5ff">
          <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/>
          <circle cx="12" cy="12" r="1.5"/>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke-width="1.2"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>NEURAL MONITOR</h1>
        <div class="sub">ESP32-P4 &middot; Face Recognition System</div>
      </div>
    </div>
    <div class="status-badge" id="status">
      <span class="ring"></span><span class="dot"></span>
      <span id="status-text">检测中...</span>
    </div>
  </div>
  <div class="stats">
    <div class="stat-card">
      <div class="stat-top"><span class="label">人脸识别</span><span class="icon-dot"></span></div>
      <div class="value" id="cnt-face">0</div>
      <div class="value-bar"><div class="fill" id="bar-face"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-top"><span class="label">语音命令</span><span class="icon-dot"></span></div>
      <div class="value" id="cnt-voice">0</div>
      <div class="value-bar"><div class="fill" id="bar-voice"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-top"><span class="label">心跳</span><span class="icon-dot"></span></div>
      <div class="value" id="cnt-heart">0</div>
      <div class="value-bar"><div class="fill" id="bar-heart"></div></div>
    </div>
  </div>
  <div class="control-bar">
    <div class="title-section">
      <h2>事件流</h2>
      <div class="live-badge"><span class="blip"></span>LIVE</div>
    </div>
    <span class="countdown">刷新倒计时 &middot; <span id="countdown">3</span>s</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th style="width:140px">类型</th><th>详情</th><th style="width:180px">时间</th></tr></thead>
      <tbody id="tbody">
        <tr class="empty-state"><td colspan="3"><div class="empty-icon">&#x25C9;</div><div class="empty-text">暂无数据 &middot; 等待设备上报...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modal-close">&times;</button>
    <h3 id="modal-title">事件详情</h3>
    <div class="detail-grid" id="modal-body"></div>
  </div>
</div>
<script>
var API_EVENTS="/api/events?limit=20";
var API_STATUS="/api/status";
var REFRESH=3,countdown=REFRESH,lastId=0;
function fmt(t){
  if(!t)return"-";
  var d=new Date(t.replace(" ","T")+"Z");
  return isNaN(d.getTime())?t:d.toLocaleString("zh-CN",{hour12:false});
}
var tL={face_recognized:"\u4eba\u8138\u8bc6\u522b",face_recognize:"\u4eba\u8138\u8bc6\u522b",voice_command:"\u8bed\u97f3\u547d\u4ee4",heartbeat:"\u5fc3\u8df3"};
function tag(t){return'<span class="tag '+t+'">'+(tL[t]||t)+"</span>";}
var kL={id:"\u7528\u6237ID",user:"\u7528\u6237",action:"\u52a8\u4f5c",cmd:"\u6307\u4ee4",command:"\u547d\u4ee4",uptime:"\u8fd0\u884c\u65f6\u957f",wifi_rssi:"WiFi\u4fe1\u53f7",rssi:"\u4fe1\u53f7\u5f3a\u5ea6",time:"\u65f6\u95f4",name:"\u59d3\u540d",confidence:"\u7f6e\u4fe1\u5ea6"};
async function fStatus(){
  try{
    var r=await fetch(API_STATUS),d=await r.json();
    var el=document.getElementById("status"),tx=document.getElementById("status-text");
    el.className="status-badge "+(d.online?"online":"offline");
    tx.textContent=d.online?"\u8bbe\u5907\u5728\u7ebf":"\u8bbe\u5907\u79bb\u7ebf";
  }catch(e){}
}
async function fEvents(){
  try{
    var r=await fetch(API_EVENTS),data=await r.json(),ev=data.events||[];
    renderT(ev);renderS(ev);
  }catch(e){}
  countdown=REFRESH;document.getElementById("countdown").textContent=countdown;
}
function renderS(ev){
  var f=0,v=0,h=0,i;
  for(i=0;i<ev.length;i++){var e=ev[i];if(e.event_type==="face_recognized")f++;else if(e.event_type==="voice_command")v++;else if(e.event_type==="heartbeat")h++;}
  var m=Math.max(f,v,h,1);
  document.getElementById("cnt-face").textContent=f;
  document.getElementById("cnt-voice").textContent=v;
  document.getElementById("cnt-heart").textContent=h;
  document.getElementById("bar-face").style.width=(f/m*100)+"%";
  document.getElementById("bar-voice").style.width=(v/m*100)+"%";
  document.getElementById("bar-heart").style.width=(h/m*100)+"%";
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function renderT(ev){
  var tb=document.getElementById("tbody");
  if(!ev.length){
    tb.innerHTML='<tr class="empty-state"><td colspan="3"><div class="empty-icon">&#x25C9;</div><div class="empty-text">\u6682\u65e0\u6570\u636e &middot; \u7b49\u5f85\u8bbe\u5907\u4e0a\u62a5...</div></td></tr>';
    return;
  }
  var l=ev[0],n=l.id>lastId;if(n)lastId=l.id;
  var h="";
  for(var i=0;i<ev.length;i++){
    var e=ev[i],dt="",ob={};
    try{
      var d=JSON.parse(e.detail||"{}");ob.parsed=d;
      var ps=[];for(var k in d)if(d.hasOwnProperty(k))ps.push((kL[k]||k)+"="+d[k]);
      dt=ps.join(", ");
    }catch(_){dt=e.detail||"-";}
    var dl=(i*0.04).toFixed(2)+"s",cl=(i===0&&n)?"just-added":"";
    var ds=esc(JSON.stringify(ob.parsed||{})),ts=esc(e.event_type),tms=esc(fmt(e.created_at));
    h+='<tr class="'+cl+'" style="animation-delay:'+dl+'" data-detail=\''+ds+'" data-type="'+ts+'" data-time="'+tms+'">';
    h+="<td>"+tag(e.event_type)+"</td>";
    h+='<td class="detail-cell" title="'+esc(dt)+'">'+esc(dt)+"</td>";
    h+='<td class="time-cell">'+fmt(e.created_at)+"</td></tr>";
  }
  tb.innerHTML=h;
  var rs=tb.querySelectorAll("tr:not(.empty-state)");
  for(var i=0;i<rs.length;i++){
    var tr=rs[i];tr.style.cursor="pointer";
    tr.addEventListener("click",function(ev2){
      var ds2=ev2.currentTarget.dataset.detail,et=ev2.currentTarget.dataset.type,etm=ev2.currentTarget.dataset.time;
      var lbs={face_recognized:"\u4eba\u8138\u8bc6\u522b",face_recognize:"\u4eba\u8138\u8bc6\u522b",voice_command:"\u8bed\u97f3\u547d\u4ee4",heartbeat:"\u5fc3\u8df3"};
      document.getElementById("modal-title").textContent=(lbs[et]||et)+" &middot; \u8be6\u60c5";
      var bd=document.getElementById("modal-body");
      var h2='<div class="k">\u7c7b\u578b</div><div class="v">'+(lbs[et]||et)+"</div>";
      h2+='<div class="k">\u65f6\u95f4</div><div class="v">'+etm+"</div>";
      try{
        var d2=JSON.parse(ds2);
        for(var k in d2)if(d2.hasOwnProperty(k))h2+='<div class="k">'+esc(kL[k]||k)+'</div><div class="v">'+esc(String(d2[k]))+"</div>";
      }catch(_){}
      bd.innerHTML=h2;
      document.getElementById("modal").classList.add("active");
    });
  }
}

document.getElementById("modal-close").addEventListener("click",function(){document.getElementById("modal").classList.remove("active");});
document.getElementById("modal").addEventListener("click",function(e){if(e.target===e.currentTarget)document.getElementById("modal").classList.remove("active");});
fEvents();fStatus();
setInterval(function(){countdown--;document.getElementById("countdown").textContent=countdown;if(countdown<=0){fEvents();fStatus();}},1000);
</script>
</body>
</html>
